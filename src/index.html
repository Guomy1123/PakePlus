<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>战火行动</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:'Consolas',monospace}
#blocker{position:fixed;inset:0;background:linear-gradient(135deg,#0a0a0f 0%,#1a0a00 50%,#0a0a0f 100%);display:flex;align-items:center;justify-content:center;z-index:100}
#blocker::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(255,60,0,.08));pointer-events:none}
#blocker .c{text-align:center;color:#fff;max-width:520px;padding:40px;position:relative}
#blocker h1{font-size:64px;color:#ff6600;text-shadow:0 0 30px rgba(255,102,0,.4),0 0 60px rgba(255,60,0,.15);margin-bottom:8px;letter-spacing:6px;font-weight:900}
#blocker .subtitle{font-size:14px;color:#888;letter-spacing:8px;text-transform:uppercase;margin-bottom:40px}
#blocker .divider{width:80px;height:2px;background:linear-gradient(90deg,transparent,#ff6600,transparent);margin:0 auto 40px}
#blocker .start-btn{display:inline-block;padding:14px 48px;font-size:18px;color:#fff;background:linear-gradient(180deg,#ff6600,#cc4400);border:none;border-radius:4px;cursor:pointer;font-family:'Consolas',monospace;letter-spacing:3px;transition:all .3s;box-shadow:0 0 20px rgba(255,102,0,.3)}
#blocker .start-btn:hover{transform:scale(1.05);box-shadow:0 0 35px rgba(255,102,0,.5)}
#blocker .hint{font-size:13px;color:#666;margin-top:16px}
#blocker .hint span{color:#f93}
#diffSel{display:flex;gap:10px;justify-content:center;margin-bottom:20px}
.diff-btn{padding:8px 20px;font-size:13px;color:#888;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:3px;cursor:pointer;font-family:'Consolas',monospace;letter-spacing:1px;transition:all .2s}
.diff-btn:hover{color:#fff;border-color:rgba(255,255,255,.4)}
.diff-btn.active{color:#ff6600;border-color:#ff6600;background:rgba(255,102,0,.1)}
#settings{margin-bottom:24px;text-align:left;max-width:320px;margin-left:auto;margin-right:auto}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.set-label{color:#aaa;font-size:13px;letter-spacing:1px}
.set-ctrl{display:flex;align-items:center;gap:12px}
.set-val{color:#ff6600;font-size:16px;font-weight:bold;min-width:36px;text-align:center}
.num-btn{width:28px;height:28px;font-size:16px;color:#aaa;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:3px;cursor:pointer;font-family:'Consolas',monospace;transition:all .15s}
.num-btn:hover{color:#fff;border-color:rgba(255,255,255,.4)}
#loading{color:#666;font-size:12px;margin-top:20px;letter-spacing:2px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;display:none}
#ch{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:30px;height:30px}
#ch::before,#ch::after{content:'';position:absolute;background:rgba(255,255,255,.9)}
#ch::before{width:2px;height:100%;left:50%;transform:translateX(-50%)}
#ch::after{height:2px;width:100%;top:50%;transform:translateY(-50%)}
.dot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:3px;height:3px;background:#f33;border-radius:50%}
#hp{position:absolute;bottom:28px;left:28px}
#hpl{color:#aaa;font-size:11px;margin-bottom:3px}
#hpb{width:190px;height:7px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.2);border-radius:2px}
#hpf{height:100%;background:linear-gradient(90deg,#f33,#3f3);border-radius:2px;transition:width .3s}
#hpv{color:#fff;font-size:24px;font-weight:bold;margin-top:3px}
#ab{position:absolute;bottom:28px;right:28px;text-align:right}
#wn{color:#aaa;font-size:11px}
#av{color:#fff;font-size:32px;font-weight:bold}
#av .r{color:#aaa;font-size:17px}
#rh{color:#f93;font-size:12px;margin-top:2px;display:none;animation:bl .6s ease-in-out infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.3}}
#sb{position:absolute;top:16px;right:26px;text-align:right}
#sv{color:#fc0;font-size:20px;font-weight:bold}
#kv{color:#aaa;font-size:12px;margin-top:2px}
#kf{position:absolute;top:50px;right:26px}
.km{color:#fff;font-size:11px;padding:3px 8px;margin-bottom:2px;background:rgba(0,0,0,.5);border-left:3px solid #f60;animation:fi .3s}
.km.hs{border-left-color:#f33}
@keyframes fi{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
#do{position:fixed;inset:0;pointer-events:none;z-index:30;background:radial-gradient(ellipse at center,transparent 50%,rgba(255,0,0,.4));opacity:0;transition:opacity .1s}
#lowhp{position:fixed;inset:0;pointer-events:none;z-index:29;background:radial-gradient(ellipse at center,transparent 30%,rgba(180,0,0,.7) 100%);opacity:0;transition:opacity .5s}
#ds{position:fixed;inset:0;background:rgba(255,0,0,.3);display:none;align-items:center;justify-content:center;z-index:50;cursor:pointer}
#ds .t{color:#fff;font-size:44px;font-weight:bold;text-shadow:0 0 30px rgba(255,0,0,.8);animation:dp 1s ease-in-out infinite}
#vs{position:fixed;inset:0;background:rgba(0,100,0,.3);display:none;align-items:center;justify-content:center;z-index:50;cursor:pointer}
#vs .t{color:#fff;font-size:44px;font-weight:bold;text-shadow:0 0 30px rgba(0,255,0,.8);animation:dp 1s ease-in-out infinite}
#ds .hint{color:#aaa;font-size:16px;margin-top:20px}
@keyframes dp{0%,100%{opacity:1}50%{opacity:.5}}
#mm{position:absolute;top:16px;left:16px;width:130px;height:130px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2);border-radius:3px}
  #ec{position:absolute;top:16px;left:156px;color:#aaa;font-size:12px}
  #kc{position:absolute;top:16px;right:120px;color:#fc0;font-size:14px;font-weight:bold}
.ehp{position:absolute;pointer-events:none;z-index:11;display:none}
.ehp-bg{width:50px;height:5px;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.3);border-radius:2px}
.ehp-bar{height:100%;background:#f33;border-radius:2px;transition:width .2s}
.ehp-name{color:#f66;font-size:9px;text-align:center;text-shadow:0 0 4px #000}
  #hm{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:18px;height:18px;opacity:0;transition:opacity .1s}
  #hm::before,#hm::after{content:'';position:absolute;background:#fff}
  #hm::before{width:7px;height:2px;top:8px;left:5px;transform:rotate(45deg)}
  #hm::after{width:7px;height:2px;top:8px;right:5px;transform:rotate(-45deg)}
  #hm.hs{background:#f33;border-radius:50%}
  #scope-overlay{position:fixed;inset:0;z-index:20;pointer-events:none;display:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.65) 70%)}
  #scope-reticle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:120px;height:120px;opacity:.85}
  #scope-reticle::before,#scope-reticle::after{content:'';position:absolute;background:rgba(255,255,255,.5)}
  #scope-reticle::before{width:1px;height:100%;left:50%;transform:translateX(-50%)}
  #scope-reticle::after{height:1px;width:100%;top:50%;transform:translateY(-50%)}
  #scope-reticle .dot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:3px;height:3px;background:#f33;border-radius:50%}
  #scope-reticle .td{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border:1px solid rgba(255,255,255,.3);border-radius:50%}
  .scoped #ch{display:none!important}
  .scoped #scope-overlay{display:block}
#particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.prt{position:absolute;border-radius:50%;opacity:0;animation:floatUp linear infinite}
.prt:nth-child(1){left:5%;animation-duration:6s;animation-delay:0s;width:3px;height:3px;background:#ff9944;box-shadow:0 0 4px #ff9944}
.prt:nth-child(2){left:12%;animation-duration:8s;animation-delay:1.2s;width:2px;height:2px;background:#ffcc66;box-shadow:0 0 3px #ffcc66}
.prt:nth-child(3){left:20%;animation-duration:5.5s;animation-delay:2.5s;width:4px;height:4px;background:#ff4400;box-shadow:0 0 6px #ff4400}
.prt:nth-child(4){left:28%;animation-duration:7s;animation-delay:.8s;width:2px;height:2px;background:#fff;box-shadow:0 0 3px #fff}
.prt:nth-child(5){left:35%;animation-duration:9s;animation-delay:3s;width:3px;height:3px;background:#ff6600;box-shadow:0 0 5px #ff6600}
.prt:nth-child(6){left:42%;animation-duration:6.5s;animation-delay:.3s;width:2px;height:2px;background:#ffaa55;box-shadow:0 0 3px #ffaa55}
.prt:nth-child(7){left:50%;animation-duration:7.5s;animation-delay:4s;width:5px;height:5px;background:#ff3300;box-shadow:0 0 8px #ff3300}
.prt:nth-child(8){left:58%;animation-duration:5s;animation-delay:1.8s;width:2px;height:2px;background:#fff;box-shadow:0 0 4px #fff}
.prt:nth-child(9){left:65%;animation-duration:8.5s;animation-delay:.5s;width:3px;height:3px;background:#ff8800;box-shadow:0 0 5px #ff8800}
.prt:nth-child(10){left:72%;animation-duration:6s;animation-delay:3.2s;width:2px;height:2px;background:#ffcc44;box-shadow:0 0 3px #ffcc44}
.prt:nth-child(11){left:80%;animation-duration:7s;animation-delay:2s;width:4px;height:4px;background:#ff5500;box-shadow:0 0 6px #ff5500}
.prt:nth-child(12){left:88%;animation-duration:9.5s;animation-delay:1s;width:2px;height:2px;background:#fff;box-shadow:0 0 3px #fff}
.prt:nth-child(13){left:15%;animation-duration:10s;animation-delay:5s;width:3px;height:3px;background:#ffaa33;box-shadow:0 0 4px #ffaa33}
.prt:nth-child(14){left:45%;animation-duration:4.5s;animation-delay:6s;width:2px;height:2px;background:#ff6633;box-shadow:0 0 3px #ff6633}
.prt:nth-child(15){left:60%;animation-duration:8s;animation-delay:4.5s;width:3px;height:3px;background:#ffbb55;box-shadow:0 0 5px #ffbb55}
.prt:nth-child(16){left:75%;animation-duration:5.5s;animation-delay:7s;width:2px;height:2px;background:#ff4422;box-shadow:0 0 3px #ff4422}
.prt:nth-child(17){left:33%;animation-duration:11s;animation-delay:2s;width:4px;height:4px;background:#ffdd77;box-shadow:0 0 6px #ffdd77}
.prt:nth-child(18){left:68%;animation-duration:7s;animation-delay:5.5s;width:2px;height:2px;background:#ff3322;box-shadow:0 0 3px #ff3322}
.prt:nth-child(19){left:48%;animation-duration:6s;animation-delay:8s;width:3px;height:3px;background:#fff;box-shadow:0 0 5px #fff}
.prt:nth-child(20){left:92%;animation-duration:9s;animation-delay:3s;width:3px;height:3px;background:#ff8844;box-shadow:0 0 4px #ff8844}
@keyframes floatUp{0%{bottom:-10px;opacity:0;transform:translateX(0)}10%{opacity:1}90%{opacity:.5}100%{bottom:100%;opacity:0;transform:translateX(30px)}}
@keyframes pulseG{0%,100%{opacity:.6}50%{opacity:1}}
#blocker h1{animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{text-shadow:0 0 30px rgba(255,102,0,.4),0 0 60px rgba(255,60,0,.15),0 0 100px rgba(255,30,0,.1)}50%{text-shadow:0 0 50px rgba(255,102,0,.7),0 0 100px rgba(255,60,0,.3),0 0 150px rgba(255,30,0,.15)}}
#blocker .start-btn{position:relative;overflow:hidden}
#blocker .start-btn::before{content:'';position:absolute;inset:-2px;background:linear-gradient(90deg,#ff6600,#ffcc00,#ff6600);background-size:200% 100%;border-radius:6px;z-index:-1;animation:borderGlow 2s linear infinite;opacity:.6}
#blocker .start-btn::after{content:'';position:absolute;inset:1px;background:linear-gradient(180deg,#ff6600,#cc4400);border-radius:3px;z-index:-1}
@keyframes borderGlow{0%{background-position:0% 50%}100%{background-position:200% 50%}}
#blocker .c{position:relative;z-index:1}
</style>
</head>
<body>
<div id="blocker">
  <div id="particles"><div class="prt"></div><div class="prt"></div><div class="prt"></div><div class="prt"></div><div class="prt"></div><div class="prt"></div><div class="prt"></div><div class="prt"></div><div class="prt"></div><div class="prt"></div><div class="prt"></div><div class="prt"></div><div class="prt"></div><div class="prt"></div><div class="prt"></div><div class="prt"></div><div class="prt"></div><div class="prt"></div><div class="prt"></div><div class="prt"></div></div>
  <div id="glow-bottom"></div>
  <div class="c">
    <h1>战火行动</h1>
    <p class="subtitle">FIRST PERSON TACTICAL SHOOTER</p>
    <div class="divider"></div>
    <div id="settings">
      <div class="set-row">
        <label class="set-label">难度</label>
        <div id="diffSel">
          <button class="diff-btn" data-diff="easy">简单</button>
          <button class="diff-btn active" data-diff="normal">普通</button>
          <button class="diff-btn" data-diff="hard">困难</button>
        </div>
      </div>
      <div class="set-row">
        <label class="set-label">敌人数量</label>
        <div class="set-ctrl">
          <button class="num-btn" id="enemyMinus">-</button>
          <span id="enemyVal" class="set-val">7</span>
          <button class="num-btn" id="enemyPlus">+</button>
        </div>
      </div>
      <div class="set-row">
        <label class="set-label">连发速度</label>
        <div class="set-ctrl">
          <button class="num-btn" id="rateMinus">-</button>
          <span id="rateVal" class="set-val">中</span>
          <button class="num-btn" id="ratePlus">+</button>
        </div>
      </div>
    </div>
    <button class="start-btn" id="startBtn">开始游戏</button>
    <div id="loading">加载引擎中...</div>
  </div>
</div>
<div id="hud">
  <div id="ch"><div class="dot"></div></div>
  <div id="hp"><div id="hpl">HEALTH</div><div id="hpb"><div id="hpf" style="width:100%"></div></div><div id="hpv">100</div></div>
  <div id="ab"><div id="av">30 <span class="r">/ 120</span></div><div id="rh">按 R 换弹</div></div>
  <div id="kf"></div><div id="ec"></div><div id="diffHUD" style="color:#666;font-size:10px;margin-top:2px"></div><div id="ehp-box"></div>
  <div id="mm"><canvas id="mc" width="130" height="130"></canvas></div>
</div>
<div id="scope-overlay"><div id="scope-reticle"><div class="td"></div><div class="dot"></div></div></div>
<div id="do"></div>
<div id="lowhp"></div>
<div id="ds"><div class="t">GAME OVER</div><div class="hint">点击返回菜单</div></div>
<div id="vs"><div class="t">VICTORY</div><div class="hint">点击返回菜单</div></div>

<script>
(function(){
  document.querySelectorAll('.diff-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      document.querySelectorAll('.diff-btn').forEach(function(b){b.classList.remove('active')});
      btn.classList.add('active');
      window.difficulty=btn.dataset.diff;
    });
  });
  // Enemy count controls
  document.getElementById('enemyMinus').addEventListener('click',function(){
    if(window.enemyCount>1){window.enemyCount--;document.getElementById('enemyVal').textContent=window.enemyCount}
  });
  document.getElementById('enemyPlus').addEventListener('click',function(){
    if(window.enemyCount<20){window.enemyCount++;document.getElementById('enemyVal').textContent=window.enemyCount}
  });
  // Fire rate controls
  document.getElementById('rateMinus').addEventListener('click',function(){
    if(window.rateIdx>0){window.rateIdx--;document.getElementById('rateVal').textContent=window.rateLevels[window.rateIdx].label}
  });
  document.getElementById('ratePlus').addEventListener('click',function(){
    if(window.rateIdx<window.rateLevels.length-1){window.rateIdx++;document.getElementById('rateVal').textContent=window.rateLevels[window.rateIdx].label}
  });
  document.addEventListener('keydown', function(e){
    if(e.code==='Enter'&&!window._gameDead){
      _snd.init();_snd.resume();
      if(!window._gameReady){
        document.getElementById('loading').textContent='请等待加载完成...';
        return;
      }
      document.getElementById('blocker').style.display='none';
      document.getElementById('hud').style.display='block';
      playing=true;window._gamePlaying=true;window._gameLocked=true;
      window._lmx=window._lmy=undefined;
      spawnEnemies();
      hideTrail();
    }
  });
  document.getElementById('startBtn').addEventListener('click',function(){
    _snd.init();_snd.resume();
    if(!window._gameReady){document.getElementById('loading').textContent='请等待加载完成...';return}
    document.getElementById('blocker').style.display='none';
    document.getElementById('hud').style.display='block';
    playing=true;window._gamePlaying=true;window._gameLocked=true;window._lmx=window._lmy=undefined;
    if(window._gameDead)restartGame();else spawnEnemies();
    hideTrail();
  });
  // Mouse trail particles (smooth)
  var trailPts=[];
  for(var ti=0;ti<20;ti++){
    var dot=document.createElement('div');
    var t=ti/19;
    var r=255;
    var g=Math.round(100+t*155);
    var b=Math.round(t*200);
    var clr='rgb('+r+','+g+','+b+')';
    var sz=Math.max(1,5-Math.abs(t-.5)*6);
    dot.style.cssText='position:fixed;width:'+sz+'px;height:'+sz+'px;background:'+clr+';border-radius:50%;pointer-events:none;z-index:101;box-shadow:0 0 '+(3+sz)+'px '+clr+';opacity:'+(.9-t*.4);
    dot.style.left='-10px';dot.style.top='-10px';
    document.body.appendChild(dot);
    trailPts.push({el:dot,x:-10,y:-10});
  }
  var mouseX=-10,mouseY=-10;
  document.addEventListener('mousemove',function(e){mouseX=e.clientX;mouseY=e.clientY});
  var trailW=0;
  var trailHidden=false;
  function hideTrail(){
    trailHidden=true;
    for(var ti=0;ti<trailPts.length;ti++)trailPts[ti].el.style.display='none';
  }
  function stepTrail(){
    if(!trailHidden){
    trailPts[0].x+=(mouseX-trailPts[0].x)*.5;
    trailPts[0].y+=(mouseY-trailPts[0].y)*.5;
    for(var ti=1;ti<trailPts.length;ti++){
      trailPts[ti].x+=(trailPts[ti-1].x-trailPts[ti].x)*.25;
      trailPts[ti].y+=(trailPts[ti-1].y-trailPts[ti].y)*.25;
    }
    for(var ti=0;ti<trailPts.length;ti++){
      trailPts[ti].el.style.left=(trailPts[ti].x-trailPts[ti].el.offsetWidth/2)+'px';
      trailPts[ti].el.style.top=(trailPts[ti].y-trailPts[ti].el.offsetHeight/2)+'px';
    }
    }
    requestAnimationFrame(stepTrail);
  }
  stepTrail();
})();
</script>
<script>

      case'KeyW':fwd=false;break;case'KeyS':bwd=false;break;
      case'KeyA':lft=false;break;case'KeyD':rgt=false;break;
      case'ShiftLeft':sprint=false;break;
      case'ArrowLeft':case'KeyQ':lookL=false;break;
      case'ArrowRight':case'KeyE':lookR=false;break;
      case'ArrowUp':lookU=false;break;
      case'ArrowDown':lookD=false;break;
    }
  });
  document.addEventListener('mousedown',function(e){if(!window._gameLocked||dead)return;if(e.button===0){mDown=true;shoot()}if(e.button===2){e.preventDefault();scoped=!scoped}});
  document.addEventListener('mouseup',function(e){if(e.button===0)mDown=false});
  document.addEventListener('mousemove',function(e){
    if(!window._gameLocked||dead)return;
    if(typeof window._lmx==='number'){
      var dx=e.clientX-window._lmx,dy=e.clientY-window._lmy;
      var sen=scoped?0.0012:0.0055;
      yaw-=dx*sen;
      pitch=Math.max(-Math.PI/2+.1,Math.min(Math.PI/2-.1,pitch-dy*sen));
    }
    window._lmx=e.clientX;window._lmy=e.clientY;
  });

  window.addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
  document.addEventListener('contextmenu',function(e){e.preventDefault()});

  window._gameReady=true;
  document.getElementById('loading').textContent='加载完成，按 Enter 进入';
  loop();
}

function doReload(){if(window.difficulty==='easy'||reloading||res<=0||ammo>=MMAG)return;reloading=true;reloadT=MRELOAD;_snd.rStart()}
function finishReload(){var n=Math.min(MMAG-ammo,res);ammo+=n;res-=n;reloading=false;_snd.rEnd()}

function shoot(){
  if(dead||reloading)return;
  if(window.difficulty!=='easy'&&ammo<=0){_snd.empty();if(res>0)doReload();return}
  var now=performance.now()/1000;
  if(now-lastFire<rateLevels[rateIdx].rate)return;
  lastFire=now;
  if(window.difficulty!=='easy')ammo--;
  playerShotSound=1;
  recoilV+=MRECOIL;pitch+=MRECOIL*.4;shootA=1;
  _snd.shoot();

  if(mFlash){
    mFlash.scale.set(1,1,1);
    mFlash.children.forEach(function(c){c.material.opacity=1});
    setTimeout(function(){
      if(mFlash){
        mFlash.children.forEach(function(c){c.material.opacity=0});
      }
    },60);
  }
  spawnGunSmoke();
  spawnShell();

  var dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  var curSpread=scoped?MSPREAD*.3:MSPREAD;
  dir.x+=(Math.random()-.5)*curSpread;dir.y+=(Math.random()-.5)*curSpread;dir.normalize();
  var ray=new THREE.Raycaster(camera.position.clone(),dir,0,MRANGE);
  var wx=ray.intersectObjects(walls,false);
  var wallDist=wx.length?wx[0].distance:1e9;
  var bestD=1e9,hitE=null,hitP=null,isHS=false;
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i];if(!e.alive)continue;
    var ix=ray.intersectObject(e.mesh,true);
    if(ix.length&&ix[0].distance<bestD&&ix[0].distance<wallDist){bestD=ix[0].distance;hitE=e;hitP=ix[0].point;isHS=ix[0].object.name==='head'||ix[0].point.y>e.mesh.position.y+1.55}
  }
  if(hitE){
    var dmg=(isHS?MDMG*MHS:MDMG)*diffMult[difficulty].dmg;
    hitE.hp-=dmg;hitE.hitTimer=.5;
    showHitmarker(isHS);
    isHS?_snd.hs():_snd.hit();
    spawnBlood(hitP);
    if(hitE.hp<=0){_snd.kill();kills++;score+=isHS?150:100;killE(hitE,isHS)}
  }else{
    if(wx.length)spawnSpark(wx[0].point);
  }
  if(window.difficulty!=='easy'&&ammo<=0&&res>0)doReload();
}

function killE(e,isHS){
  e.alive=false;e.hp=0;
  e.deathAnim=0;e.deathDir=Math.random()>.5?'x':'z';
  var kf=document.getElementById('kf');
  var km=document.createElement('div');
  km.className='km'+(isHS?' hs':'');
  km.textContent=(isHS?'爆头击杀':'击杀')+' ENEMY'+(e.idx+1);
  kf.appendChild(km);
  setTimeout(function(){km.style.opacity='0';km.style.transition='opacity .3s';setTimeout(function(){km.remove()},300)},2000);
  if(kf.children.length>5)kf.firstChild.remove();
  var aliveCount=enemies.filter(function(ev){return ev.alive}).length;
  if(aliveCount<=0)setTimeout(function(){showVictory()},600);
}

// Gun smoke
var _smokePool=[],_smokeIdx=0;
function spawnGunSmoke(){
  var s;
  if(_smokePool.length<12){
    var g=new THREE.SphereGeometry(.04,4,4);
    var m=new THREE.MeshBasicMaterial({color:0xaaaaaa,transparent:true,opacity:.35,depthWrite:false});
    s=new THREE.Mesh(g,m);s.scale.set(1,1,1);
    _smokePool.push(s);
  }else{s=_smokePool[_smokeIdx%_smokePool.length];_smokeIdx++}
  s.material.opacity=.35;s.scale.set(.5,.5,.5);
  var fwd=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  var right=new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
  s.position.copy(camera.position).addScaledVector(fwd,1.8).addScaledVector(right,.18).add(new THREE.Vector3(0,-.2,0));
  s.position.x+=(Math.random()-.5)*.08;s.position.z+=(Math.random()-.5)*.08;
  scene.add(s);
  var t=0,vy=.15+Math.random()*.1,vx=(Math.random()-.5)*.3,vz=(Math.random()-.5)*.3;
  (function anim(){
    t+=.016;if(t>1.8){scene.remove(s);return}
    s.position.x+=vx*.016;s.position.y+=vy*.016;s.position.z+=vz*.016;
    vy*=.97;var sc=.5+t*.8;s.scale.set(sc,sc,sc);
    s.material.opacity=.35*(1-t/1.8);
    requestAnimationFrame(anim);
  })();
}

// Bullet shell ejection
var _shellPool=[],_shellIdx=0;
function spawnShell(){
  var s;
  if(_shellPool.length<15){
    var g=new THREE.CylinderGeometry(.012,.012,.035,6);
    var m=new THREE.MeshStandardMaterial({color:0xddaa33,metalness:.9,roughness:.2});
    s=new THREE.Mesh(g,m);
    _shellPool.push(s);
  }else{s=_shellPool[_shellIdx%_shellPool.length];_shellIdx++}
  s.material.opacity=1;s.material.transparent=false;
  var fwd=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  var right=new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
  var up=new THREE.Vector3(0,1,0);
  s.position.copy(camera.position).addScaledVector(fwd,.85).addScaledVector(right,.32).addScaledVector(up,-.2);
  s.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
  scene.add(s);
  var vx=right.x*3+right.y*1+(Math.random()-.5);
  var vy=2+Math.random();
  var vz=right.z*3+right.y*1+(Math.random()-.5);
  var t=0,groundY=.02;
  (function anim(){
    t+=.016;if(t>3){scene.remove(s);return}
    s.position.x+=vx*.016;s.position.y+=vy*.016;s.position.z+=vz*.016;
    vy-=9.8*.016;
    s.rotation.x+=10*.016;s.rotation.z+=7*.016;
    if(s.position.y<groundY){s.position.y=groundY;vy=Math.abs(vy)*.25;vx*=.4;vz*=.4;
      if(Math.abs(vy)<.15){s.material.opacity=Math.max(0,1-(t-1)*1.5);s.material.transparent=true}
    }
    requestAnimationFrame(anim);
  })();
}

function updateE(e,d){
  if(!e.alive)return;
  // Init per-enemy fields
  e.eammo=e.eammo==null?EMAG:e.eammo;e.burstTimer=e.burstTimer||0;e.coverTimer=e.coverTimer||0;
  e.lostSightTimer=e.lostSightTimer||0;e.morale=1;

  var px=camera.position.x,py=1,pz=camera.position.z;
  var ex=e.mesh.position.x,ey=1,ez=e.mesh.position.z;
  var dx=px-ex,dz=pz-ez,dist=Math.sqrt(dx*dx+dz*dz);
  var see=dist<EDET&&los({x:ex,y:ey,z:ez},{x:px,y:py,z:pz});

  // --- Morale: HP loss + dead allies ---
  e.morale-=Math.max(0,(EHP-e.hp)/EHP)*.45;
  var aAlive=0;for(var mj=0;mj<enemies.length;mj++)if(enemies[mj].alive)aAlive++;
  e.morale-=Math.max(0,enemies.length-aAlive)*.12;
  e.morale=Math.max(.1,e.morale);

  // --- Sound awareness (hear player gunfire) ---
  if(playerShotSound&&dist<EDET*1.4){
    e.alert=Math.min(e.alert+d*1.8,1);
    if(!e.lastSeenPos||dist<EDET*.5){e.lastSeenPos={x:px,z:pz};e.lastSeenTime=performance.now()/1000}
  }

  // --- Visual contact ---
  if(see){
    e.alert=Math.min(e.alert+d*3.8,1);
    e.lastSeenPos={x:px,z:pz};e.lastSeenTime=performance.now()/1000;
    e.lostSightTimer=0;
  }else{
    e.alert=Math.max(e.alert-d*.35,0);
    e.lostSightTimer+=d;
  }

  // Ally coordination: share awareness + nearby ally hit drops morale
  for(var ai=0;ai<enemies.length;ai++){
    var a=enemies[ai];if(a===e||!a.alive)continue;
    var adx=ex-a.mesh.position.x,adz=ez-a.mesh.position.z;
    if(Math.sqrt(adx*adx+adz*adz)<12&&a.alert>.5)e.alert=Math.min(e.alert+d*2.2,1);
    if(a.hitTimer>0&&Math.sqrt(adx*adx+adz*adz)<9)e.morale-=.06;
  }
  e.sqRole=e.sqRole||(e.idx%3===0?'assault':e.idx%3===1?'flanker':'support');

  // Perpendicular for flanking
  var perpX=-(pz-ez),perpZ=px-ex;
  var perpL=Math.sqrt(perpX*perpX+perpZ*perpZ)||1;perpX/=perpL;perpZ/=perpL;

  // --- Smooth rotation ---
  var tr=e.mesh.rotation.y;
  if(e.alert>.2||e.state!=='patrol')tr=Math.atan2(px-ex,pz-ez);
  else if(e.state==='patrol'&&e.patrol)tr=Math.atan2(e.patrol.x-ex,e.patrol.z-ez);
  var cr=e.mesh.rotation.y,adr=tr-cr;
  while(adr>Math.PI)adr-=Math.PI*2;while(adr<-Math.PI)adr+=Math.PI*2;
  e.mesh.rotation.y=cr+adr*Math.min(d*8,1);

  e.hitTimer=(e.hitTimer||0)-d;

  switch(e.state){
  case'patrol':
    if(e.alert>.4){e.state='chase';e.reactT=EREC*e.morale;e.patrolPause=0;break}
    e.patrolPause=(e.patrolPause||0)+d;
    var tg=e.patrol;
    var tdx=tg.x-ex,tdz=tg.z-ez,tdl=Math.sqrt(tdx*tdx+tdz*tdz);
    if(tdl<1.5||e.patrolPause>12){
      e.patrolPause=0;
      if(e.alert>.15){var pa=rndP();var tt=0;while(Math.sqrt((pa.x-px)*(pa.x-px)+(pa.z-pz)*(pa.z-pz))>24&&tt++<8)pa=rndP();e.patrol=pa}
      else e.patrol=rndP();
      break;
    }
    if(e.patrolPause>.4){var nsp=e.spd*d,nxp=ex+tdx/tdl*nsp,nzp=ez+tdz/tdl*nsp;var r1=trySlide(ex,ez,nxp,nzp,ER);if(r1)e.mesh.position.set(r1.x,0,r1.z);else e.patrol=rndP()}
    break;

  case'chase':
    e.reactT-=d;
    e.coverTimer-=d;
    if(e.coverTimer<=0&&see){var c1=findCover(ex,ez,px,pz,14,false);if(c1){e.coverPos=c1;e.coverTimer=2+Math.random()*3}}
    if(e.reactT<=0){
      if(dist<ESHOOT&&see&&e.morale>.2){e.state='shoot';e.strafeDir=1;e.strafeT=0;e.burstTimer=0;break}
      if(!see&&e.lostSightTimer>4&&e.alert<.2){e.state='patrol';break}
      var mx,mz,role=e.sqRole;
      if(role==='assault'){
        if(e.coverPos){var dc=Math.sqrt((e.coverPos.x-ex)*(e.coverPos.x-ex)+(e.coverPos.z-ez)*(e.coverPos.z-ez));if(dc>2){mx=e.coverPos.x-ex;mz=e.coverPos.z-ez}else{mx=dx/(dist||1);mz=dz/(dist||1)}}
        else{mx=dx/(dist||1);mz=dz/(dist||1)}
      }else if(role==='flanker'){
        var fa=e.idx%2?2:-2;mx=perpX*fa*.55+dx/(dist||1)*.45;mz=perpZ*fa*.55+dz/(dist||1)*.45;
      }else{
        if(dist>ESHOOT*1.1){mx=dx/(dist||1);mz=dz/(dist||1)}else{mx=-dx/(dist||1);mz=-dz/(dist||1)}
      }
      if(e.lastSeenPos&&!see&&e.lostSightTimer>1){
        var ldx=e.lastSeenPos.x-ex,ldz=e.lastSeenPos.z-ez,ldl=Math.sqrt(ldx*ldx+ldz*ldz)||1;
        mx=mx*.3+ldx/ldl*.7;mz=mz*.3+ldz/ldl*.7;
      }
      var ml=Math.sqrt(mx*mx+mz*mz)||1;mx/=ml;mz/=ml;
      var spd=(role==='assault'?ECHASE:ECHASE*.7)*d;
      var cnx=ex+mx*spd,cnz=ez+mz*spd;
      var r2=trySlide(ex,ez,cnx,cnz,ER);
      if(r2)e.mesh.position.set(r2.x,0,r2.z);else e.reactT=EREC*.5;
    }
    // Support: suppressive fire while chasing
    if(e.sqRole==='support'&&see&&dist<ESHOOT+6){
      var ns=performance.now()/1000;
      if(ns-e.lastShot>=ESHINT*1.3&&Math.random()<e.acc*.5){e.lastShot=ns;eshoot(e,px,py,pz,dist,e.acc*.6);enemyMuzzleFlash({x:ex,y:1.3,z:ez-.35})}
    }
    break;

  case'shoot':
    if(dist>ESHOOT+8||e.morale<.15){e.state=e.hp<EHP*.35?'retreat':'chase';e.reactT=EREC*.4;break}
    if(!see&&e.lostSightTimer>3){e.state='chase';e.reactT=EREC*.4;break}
    // Reload
    if(e.eammo<=0){e.reloadTimer=(e.reloadTimer||0)+d;if(e.reloadTimer>ERELOAD){e.eammo=EMAG;e.reloadTimer=0}e.mesh.position.z+=perpZ*e.strafeDir*1.5*d;break}
    // Movement
    e.strafeT+=d;
    var ssp=2.2+Math.random()*1.5,idealD=e.sqRole==='assault'?6:14,distErr=dist-idealD;
    var tx=dx/(dist||1),tz=dz/(dist||1);
    var mdx=perpX*e.strafeDir*ssp*d,mdz=perpZ*e.strafeDir*ssp*d;
    if(Math.abs(distErr)>3){mdx-=tx*distErr*d*.22;mdz-=tz*distErr*d*.22}
    e.coverTimer-=d;
    if(e.coverTimer<=0){var c2=findCover(ex,ez,px,pz,10,false);if(c2){e.coverPos=c2;e.coverTimer=1.5+Math.random()*1.5}}
    if(e.coverPos){var cdx6=e.coverPos.x-ex,cdz6=e.coverPos.z-ez,cdl6=Math.sqrt(cdx6*cdx6+cdz6*cdz6)||1;if(cdl6>2.5){mdx+=cdx6/cdl6*ssp*.25*d;mdz+=cdz6/cdl6*ssp*.25*d}}
    if(e.strafeT>1+Math.random()*.6){e.strafeT=0;e.strafeDir*=-1}
    var smx=ex+mdx,smz=ez+mdz,r3=trySlide(ex,ez,smx,smz,ER);
    if(r3)e.mesh.position.set(r3.x,0,r3.z);
    var moved=!!(r3&&(Math.abs(r3.x-ex)>.001||Math.abs(r3.z-ez)>.001));
    // Accuracy
    var movPen=moved?.2:0,dstPen=dist>ESHOOT*.7?.18:0;
    var effAcc=e.acc-movPen-dstPen;if(effAcc<.12)effAcc=.12;
    // Burst fire
    e.burstTimer-=d;
    var now=performance.now()/1000;
    if(now-e.lastShot>=ESHINT&&e.burstTimer<=0&&see){
      e.lastShot=now;e.eammo--;e.burstCount++;
      if(e.burstCount>=3+Math.floor(Math.random()*2)){e.burstTimer=.25+Math.random()*.4;e.burstCount=0}
      if(Math.random()<effAcc)eshoot(e,px,py,pz,dist,effAcc);
      enemyMuzzleFlash({x:ex,y:1.3,z:ez-.35});
      var ef=e.mesh.getObjectByName('muzzleFlash');if(ef){ef.material.opacity=1;setTimeout(function(){if(ef)ef.material.opacity=0},40)}
    }else if(!see&&e.lastSeenPos&&e.lostSightTimer<3.5&&now-e.lastShot>=ESHINT*1.8&&difficulty!=='easy'){
      _snd.eShoot();e.lastShot=now;e.eammo--;enemyMuzzleFlash({x:ex,y:1.3,z:ez-.35});
      var ef2=e.mesh.getObjectByName('muzzleFlash');if(ef2){ef2.material.opacity=1;setTimeout(function(){if(ef2)ef2.material.opacity=0},40)}
    }
    break;

  case'retreat':
    var rdx=ex-px,rdz=ez-pz,rdl=Math.sqrt(rdx*rdx+rdz*rdz)||1;rdx/=rdl;rdz/=rdl;
    var c3=findCover(ex,ez,ex+rdx*10,ez+rdz*10,14,true);
    var tX,tZ;
    if(c3){tX=c3.x;tZ=c3.z}else{tX=ex+rdx*ECHASE*1.4*d;tZ=ez+rdz*ECHASE*1.4*d}
    var rnnx=ex+(tX-ex)*.5,rrnz=ez+(tZ-ez)*.5,r4=trySlide(ex,ez,rnnx,rrnz,ER);
    if(r4)e.mesh.position.set(r4.x,0,r4.z);
    if(e.eammo<EMAG){e.reloadTimer=(e.reloadTimer||0)+d;if(e.reloadTimer>ERELOAD*.7){e.eammo=EMAG;e.reloadTimer=0}}
    e.retreatT=(e.retreatT||0)+d;
    if(e.retreatT>3.5||dist>ESHOOT+12){e.retreatT=0;e.state='chase';e.reactT=EREC;e.hp=Math.min(e.hp+EHP*.1,EHP)}
    break;
  }
  // Walk animation (speed varies with movement)
  var legs=e.legGrps;
  if(legs){
    var spdFactor=e.state==='shoot'?1:Math.max(3,e.state==='chase'||e.state==='retreat'?ECHASE:e.spd);
    e.footT+=d*spdFactor*2.2;
    legs[0].rotation.x=Math.sin(e.footT)*.5;
    legs[1].rotation.x=Math.sin(e.footT+Math.PI)*.5;
  }

  // Push away from player to avoid overlap
  var edx=e.mesh.position.x-camera.position.x,edz=e.mesh.position.z-camera.position.z;
  var edl=Math.sqrt(edx*edx+edz*edz)||1;
  if(edl<.65){e.mesh.position.x+=edx/edl*(.65-edl);e.mesh.position.z+=edz/edl*(.65-edl)}
}

function pHit(d){if(dead)return;var now=performance.now()/1000;if(now-playerLastHitTime<1)return;playerLastHitTime=now;hp=Math.max(0,hp-d);dmgFlash();_snd.dmg();if(hp<=0){_snd.death();pDie()}}

function loop(){
  requestAnimationFrame(loop);
  var d=Math.min(clock.getDelta(),.1);
  if((!playing&&!window._gamePlaying)||dead){renderer.render(scene,camera);return}

  var spd=sprint?SSPD:PSPD,dirx=0,dirz=0;
  if(reloading)spd*=0.6;
  if(fwd)dirz-=1;if(bwd)dirz+=1;if(lft)dirx-=1;if(rgt)dirx+=1;
  var dlen=Math.sqrt(dirx*dirx+dirz*dirz);

  // Gun collision - defined outside movement block so it's accessible after rotation
  var _gcp=Math.cos(pitch),_gsp=Math.sin(pitch),_gcy=Math.cos(yaw),_gsy=Math.sin(yaw);
  var _gpts=[[.22,-.225,-2.63],[.16,-.225,-2.63],[.28,-.225,-2.63],[.22,-.225,-2.1],[.16,-.225,-2.1],[.28,-.225,-2.1],[.22,-.225,-1.55],[.16,-.225,-1.55],[.28,-.225,-1.55],[.22,-.225,-1.0],[.16,-.225,-1.0],[.28,-.225,-1.0],[.22,-.25,-.68],[.16,-.25,-.68],[.28,-.25,-.68]];
  function gunHitsWall(px,pz){
    for(var gc2=0;gc2<_gpts.length;gc2++){
      var lx=_gpts[gc2][0],ly=_gpts[gc2][1],lz=_gpts[gc2][2];
      var ry=ly*_gsp+lz*_gcp;
      var gmwx=px+lx*_gcy+ry*_gsy;
      var gmwz=pz-lx*_gsy+ry*_gcy;
      var gWorldY=camera.position.y+ly*_gcp-lz*_gsp;
      var baseGx=Math.floor(gmwx/CS),baseGz=Math.floor(gmwz/CS);
      for(var ddx=-1;ddx<=1;ddx++){
        for(var ddz=-1;ddz<=1;ddz++){
          var gx=baseGx+ddx,gz=baseGz+ddz;
          if(gx<0||gx>=ML[0].length||gz<0||gz>=ML.length)continue;
          if(ML[gz][gx]!==1&&ML[gz][gx]!==4)continue;
          if(ddx===0&&ddz===0)return true;
          var cx=Math.max(gx*CS,Math.min(gmwx,(gx+1)*CS));
          var cz=Math.max(gz*CS,Math.min(gmwz,(gz+1)*CS));
          var dx=gmwx-cx,dz=gmwz-cz;
          if(dx*dx+dz*dz<.0064)return true;
        }
      }
      for(var ci2=0;ci2<cratePositions.length;ci2++){
        var cr2=cratePositions[ci2],crR2=cr2.r||.6;
        var dxc=gmwx-cr2.x,dzc=gmwz-cr2.z;
        if(gWorldY<cr2.h+PH&&dxc*dxc+dzc*dzc<crR2*crR2)return true;
      }
    }
    return false;
  }

  if(dlen>0){
    dirx/=dlen;dirz/=dlen;
    var sy=Math.sin(yaw),cy=Math.cos(yaw);
    var mx=dirx*cy+dirz*sy,mz=-dirx*sy+dirz*cy;
    var npx=camera.position.x+mx*spd*d,npz=camera.position.z+mz*spd*d;
    var prDiag=PR*.707;
    var canX=wk(npx+PR,camera.position.z)&&wk(npx-PR,camera.position.z)&&wk(npx+prDiag,camera.position.z+prDiag)&&wk(npx+prDiag,camera.position.z-prDiag)&&wk(npx-prDiag,camera.position.z+prDiag)&&wk(npx-prDiag,camera.position.z-prDiag);
    var canZ=wk(camera.position.x,npz+PR)&&wk(camera.position.x,npz-PR)&&wk(camera.position.x+prDiag,npz+prDiag)&&wk(camera.position.x+prDiag,npz-prDiag)&&wk(camera.position.x-prDiag,npz+prDiag)&&wk(camera.position.x-prDiag,npz-prDiag);
    // Crate + barrel collision
    for(var ci=0;ci<cratePositions.length;ci++){
      var cr=cratePositions[ci],crR=cr.r||.6;
      var dxx=npx-cr.x,dzz=camera.position.z-cr.z;
      if(camera.position.y<cr.h+PH&&Math.sqrt(dxx*dxx+dzz*dzz)<crR)canX=false;
      dxx=camera.position.x-cr.x;dzz=npz-cr.z;
      if(camera.position.y<cr.h+PH&&Math.sqrt(dxx*dxx+dzz*dzz)<crR)canZ=false;
    }
    // Push enemies away + block player from entering enemies
    for(var i=0;i<enemies.length;i++){
      if(!enemies[i].alive)continue;
      var ex2=enemies[i].mesh.position.x,ez2=enemies[i].mesh.position.z;
      var pdx=camera.position.x-ex2,pdz=camera.position.z-ez2,pdl=Math.sqrt(pdx*pdx+pdz*pdz)||1;
      if(pdl<.9){enemies[i].mesh.position.x-=pdx/pdl*0.5;enemies[i].mesh.position.z-=pdz/pdl*0.5;if(pdl<.7){canX=false;canZ=false}}
      var pnpx=npx-ex2,pnpz=npz-ez2,pndl=Math.sqrt(pnpx*pnpx+pnpz*pnpz);
      if(pndl<.7){canX=false;canZ=false}
    }
    // Gun collision - block movement if gun muzzle/body would enter wall
    if(gunHitsWall(npx,npz)){canX=false;canZ=false}
    if(canX)camera.position.x=npx;
    if(canZ)camera.position.z=npz;
    if(!canX&&!canZ&&dlen>0){
      var tryX=camera.position.x+mx*spd*d;
      var prD2=PR*.707;
      var xOk=wk(tryX+PR,camera.position.z)&&wk(tryX-PR,camera.position.z)&&wk(tryX+prD2,camera.position.z+prD2)&&wk(tryX+prD2,camera.position.z-prD2)&&wk(tryX-prD2,camera.position.z+prD2)&&wk(tryX-prD2,camera.position.z-prD2);
      if(xOk){
        for(var ci=0;ci<cratePositions.length;ci++){var cr=cratePositions[ci],crR=cr.r||.6;if(camera.position.y<cr.h+PH&&Math.sqrt((tryX-cr.x)*(tryX-cr.x)+(camera.position.z-cr.z)*(camera.position.z-cr.z))<crR){xOk=false;break}}
      }
      if(xOk&&!gunHitsWall(tryX,camera.position.z)){
        camera.position.x=tryX;
      }else{
        var tryZ=camera.position.z+mz*spd*d;
        var zOk=wk(camera.position.x,tryZ+PR)&&wk(camera.position.x,tryZ-PR)&&wk(camera.position.x+prD2,tryZ+prD2)&&wk(camera.position.x+prD2,tryZ-prD2)&&wk(camera.position.x-prD2,tryZ+prD2)&&wk(camera.position.x-prD2,tryZ-prD2);
        if(zOk&&!gunHitsWall(camera.position.x,tryZ))camera.position.z=tryZ;
      }
    }
    bobS=Math.min(bobS+d*10,1);
    _stepT+=(fwd||bwd||lft||rgt)?d:0;
    var _si=sprint?.3:.5;
    if(_stepT>=_si&&ground){_stepT=0;_snd.step();}
  }else bobS=Math.max(bobS-d*5,0);

  vy-=15*d;camera.position.y+=vy*d;
  // Stand on crates (only when falling down)
  if(vy<0&&onCrate<0&&camera.position.y>PH+.3){
    for(var ci=0;ci<cratePositions.length;ci++){
      var cr=cratePositions[ci];
      if(Math.abs(camera.position.x-cr.x)<1.0&&Math.abs(camera.position.z-cr.z)<1.0&&camera.position.y<=cr.h+PH){
        camera.position.y=cr.h+PH;vy=0;ground=true;onCrate=ci;break;
      }
    }
  }
  if(onCrate>=0){
    var cr=cratePositions[onCrate];
    if(Math.abs(camera.position.x-cr.x)>1.0||Math.abs(camera.position.z-cr.z)>1.0)onCrate=-1;
    else{camera.position.y=cr.h+PH;vy=0;ground=true}
  }
  if(camera.position.y<=PH){camera.position.y=PH;vy=0;ground=true;onCrate=-1}

  if(lookL)yaw+=2*d;if(lookR)yaw-=2*d;
  if(lookU)pitch=Math.min(Math.PI/2-.1,pitch+1.5*d);
  if(lookD)pitch=Math.max(-Math.PI/2+.1,pitch-1.5*d);
  camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;

  // Post-rotation gun collision - push camera back if gun clips through wall/crate/barrel
  if(gunHitsWall(camera.position.x,camera.position.z)){
    var pushSteps=0;
    while(gunHitsWall(camera.position.x,camera.position.z)&&pushSteps<8){
      var pdx=0,pdz=0;
      for(var gi=0;gi<_gpts.length;gi++){
        var lx=_gpts[gi][0],ly=_gpts[gi][1],lz=_gpts[gi][2];
        var ry=ly*Math.sin(pitch)+lz*Math.cos(pitch);
        var wx=camera.position.x+lx*Math.cos(yaw)+ry*Math.sin(yaw);
        var wz=camera.position.z-lx*Math.sin(yaw)+ry*Math.cos(yaw);
        var gWorldY2=camera.position.y+ly*Math.cos(pitch)-lz*Math.sin(pitch);
        var gx=Math.floor(wx/CS),gz=Math.floor(wz/CS);
        if(gx>=0&&gx<ML[0].length&&gz>=0&&gz<ML.length&&(ML[gz][gx]===1||ML[gz][gx]===4)){
          var wallCx=gx*CS+CS/2,wallCz=gz*CS+CS/2;
          pdx+=camera.position.x-wallCx;pdz+=camera.position.z-wallCz;
        }
        for(var ci3=0;ci3<cratePositions.length;ci3++){
          var cr3=cratePositions[ci3],crR3=cr3.r||.6;
          var dxc2=wx-cr3.x,dzc2=wz-cr3.z;
          if(gWorldY2<cr3.h+PH&&dxc2*dxc2+dzc2*dzc2<crR3*crR3){
            pdx+=camera.position.x-cr3.x;pdz+=camera.position.z-cr3.z;
          }
        }
      }
      var pLen=Math.sqrt(pdx*pdx+pdz*pdz)||1;
      camera.position.x+=pdx/pLen*.15;
      camera.position.z+=pdz/pLen*.15;
      pushSteps++;
    }
  }

  recoilV*=.88;recoilOff+=recoilV;recoilOff*=.94;
  bob+=d*bobS*10;

  // Update weapon bob & FP arms
  if(wGroup){
    var pullBack=0;

    // Reload animation
    var reloadOffX=0,reloadOffY=0,reloadOffZ=0,reloadRotX=0,mgOffY=0;
    if(reloading){
      var rp=1-reloadT/MRELOAD; // 0→1
      if(rp<.2){
        var t=rp/.2;
        reloadOffY=-t*.15;reloadRotX=t*.08;
      }else if(rp<.5){
        var t=(rp-.2)/.3;
        reloadOffY=-.15;reloadRotX=.08;
        mgOffY=-t*.2;
      }else if(rp<.75){
        var t=(rp-.5)/.25;
        mgOffY=-(1-t)*.2;
        reloadOffY=-.15+t*.05;reloadRotX=.08-t*.04;
      }else{
        var t=(rp-.75)/.25;
        reloadOffY=-.1*(1-t);reloadRotX=.04*(1-t);
        mgOffY=0;
        if(rp>.85&&rp<.92){var bt=(rp-.85)/.07;reloadRotX+=bt*.06}
        if(rp>.92&&rp<1){var bt2=(rp-.92)/.08;reloadRotX-=bt2*.06}
      }
    }

    // Scope weapon position
    var scopeOffX=0,scopeOffY=0,scopeOffZ=0;
    if(scoped){
      scopeOffX=-.1;scopeOffY=.02;scopeOffZ=-.12;
    }

    wGroup.position.x=.22+Math.sin(bob)*.006*bobS+reloadOffX+scopeOffX;
    wGroup.position.y=-.25+Math.abs(Math.cos(bob))*.008*bobS-recoilOff+reloadOffY+scopeOffY;
    shootA*=.85;
    wGroup.position.z=-.5+shootA*.06+pullBack+reloadOffZ+scopeOffZ;

    wGroup.rotation.x=-shootA*.12+reloadRotX;

    // Magazine reload animation
    if(mgMesh){
      mgMesh.position.y=-.13+mgOffY;
      mgMesh.rotation.x=.15+mgOffY*2;
    }

    }

  // Scope FOV transition
  var targetFOV=scoped?18:75;
  scopeTV+=(targetFOV-scopeTV)*Math.min(d*10,1);
  camera.fov=scopeTV;camera.updateProjectionMatrix();

  // Scope overlay & hide weapon
  document.body.className=scoped?'scoped':'';
  if(wGroup)wGroup.visible=!scoped;

  if(reloading){reloadT-=d;if(reloadT<=0)finishReload()}
  if(mDown&&window._gameLocked)shoot();

  // Update enemies
  for(var i2=0;i2<enemies.length;i2++)updateE(enemies[i2],d);
  // Push enemies away from crates
  for(var ci=0;ci<cratePositions.length;ci++){
    var cr=cratePositions[ci];
    for(var ei=0;ei<enemies.length;ei++){
      if(!enemies[ei].alive)continue;
      var dex=enemies[ei].mesh.position.x-cr.x,dez=enemies[ei].mesh.position.z-cr.z;
      if(Math.abs(dex)<.85&&Math.abs(dez)<.85&&Math.sqrt(dex*dex+dez*dez)<.85){
        var dl=Math.sqrt(dex*dex+dez*dez)||1;
        enemies[ei].mesh.position.x+=dex/dl*0.08;
        enemies[ei].mesh.position.z+=dez/dl*0.08;
      }
    }
  }
  playerShotSound=0;

  // Continuous victory check & death animations
  var aliveCount=0;
  for(var i3=0;i3<enemies.length;i3++){
    var e=enemies[i3];
    if(e.alive&&e.hp<=0){e.alive=false;e.deathAnim=0;e.deathDir=Math.random()>.5?'x':'z'}
    if(e.alive)aliveCount++;
    if(e.deathAnim!==undefined){
      e.deathAnim+=d*3.5;
      if(e.deathAnim>1)e.deathAnim=1;
      var t=e.deathAnim;
      if(e.deathDir==='x')e.mesh.rotation.x=t*Math.PI/2;
      else e.mesh.rotation.z=t*Math.PI/2;
      e.mesh.position.y=-t*.7;
    }
  }
  if(enemies.length>0&&aliveCount===0&&!window._gameDead){setTimeout(function(){showVictory()},500)}

  // HUD update
  document.getElementById('ec').textContent='剩余: '+aliveCount;
  var diffNames={easy:'简单',normal:'普通',hard:'困难'};
  var diffColors={easy:'#3f3',normal:'#aaa',hard:'#f33'};
  document.getElementById('diffHUD').textContent='难度: '+diffNames[window.difficulty];
  document.getElementById('diffHUD').style.color=diffColors[window.difficulty];

  // Enemy health bars
  var ehpBox=document.getElementById('ehp-box');
  if(!window._ehpInited||window._ehpCount!==enemies.length){
    window._ehpInited=true;window._ehpCount=enemies.length;window._ehpEls=[];
    ehpBox.innerHTML='';
    for(var i4=0;i4<enemies.length;i4++){
      var ee=document.createElement('div');ee.className='ehp';
      ee.innerHTML='<div class="ehp-name">ENEMY</div><div class="ehp-bg"><div class="ehp-bar" style="width:100%"></div></div>';
      ehpBox.appendChild(ee);window._ehpEls.push(ee);
    }
  }
  for(var i5=0;i5<enemies.length;i5++){
    var e2=enemies[i5],el=window._ehpEls[i5];
    if(!e2.alive){el.style.display='none';continue}
    var epos=e2.mesh.position.clone();epos.y=1;
    var ppos=camera.position.clone();ppos.y=1;
    if(!los(ppos,epos)){el.style.display='none';continue}
    var pos=e2.mesh.position.clone();pos.y+=2.5;
    pos.project(camera);
    if(pos.z>1){el.style.display='none';continue}
    var sx=(pos.x*.5+.5)*innerWidth,sy=(-pos.y*.5+.5)*innerHeight;
    el.style.display='block';el.style.left=(sx-25)+'px';el.style.top=(sy-24)+'px';
    el.querySelector('.ehp-bar').style.width=(e2.hp/EHP*100)+'%';
    el.querySelector('.ehp-bar').style.background=e2.hp/EHP>.5?'#3f3':e2.hp/EHP>.25?'#fa3':'#f33';
  }

  // HUD update
  var hpp=(hp/100)*100;
  document.getElementById('hpf').style.width=hpp+'%';
  document.getElementById('hpv').textContent=Math.ceil(hp);
  document.getElementById('hpv').style.color=hpp<30?'#f33':hpp<60?'#fa3':'#3f3';
  document.getElementById('lowhp').style.opacity=hpp<30?(30-hpp)/30*.6:0;
  document.getElementById('av').innerHTML=window.difficulty==='easy'?'∞ <span class="r">/ ∞</span>':ammo+' <span class="r">/ '+res+'</span>';
  var rh=document.getElementById('rh');
  if(window.difficulty==='easy'){rh.style.display='none'}
  else if(reloading){rh.style.display='block';rh.textContent='换弹中...'}
  else if(ammo<=5&&res>0){rh.style.display='block';rh.textContent='按 R 换弹'}
  else rh.style.display='none';
  var sp=15+bobS*10+Math.abs(recoilOff)*200;
  document.getElementById('ch').style.width=(30+sp)+'px';
  document.getElementById('ch').style.height=(30+sp)+'px';

  // Minimap
  var mc=document.getElementById('mc'),ctx=mc.getContext('2d'),sc=130/(ML.length*CS);
  ctx.clearRect(0,0,130,130);ctx.fillStyle='rgba(20,20,35,.85)';ctx.fillRect(0,0,130,130);
  ctx.fillStyle='#445';
  for(var mz=0;mz<ML.length;mz++)for(var mx2=0;mx2<ML[mz].length;mx2++){
    var mv=ML[mz][mx2];
    if(mv===1||mv===4)ctx.fillRect(mx2*CS*sc,mz*CS*sc,CS*sc,CS*sc);
    else if(mv===2){ctx.fillStyle='#8B6914';ctx.fillRect(mx2*CS*sc,mz*CS*sc,CS*sc,CS*sc);ctx.fillStyle='#445'}
    else if(mv===3){ctx.fillStyle='#2a5a2a';ctx.fillRect(mx2*CS*sc,mz*CS*sc,CS*sc,CS*sc);ctx.fillStyle='#445'}
  }
  ctx.fillStyle='#3f3';ctx.beginPath();ctx.arc(camera.position.x*sc,camera.position.z*sc,3,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#3f3';ctx.lineWidth=1;ctx.beginPath();
  ctx.moveTo(camera.position.x*sc,camera.position.z*sc);
  ctx.lineTo(camera.position.x*sc-Math.sin(yaw)*8,camera.position.z*sc-Math.cos(yaw)*8);
  ctx.stroke();

  renderer.render(scene,camera);
}

if(typeof THREE!=='undefined')init();
})();
